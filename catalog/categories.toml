# Hand-maintained grouping of hubverse-org repositories.
# scripts/build.py lists every repository in the org. A repository that
# is not named here appears under "Uncategorised" in llms.txt, so a new
# repository is never silently left out.

[[category]]
key = "core-r"
title = "Core R packages"
summary = "Install together with the hubverse meta-package. Hub administration, data access, validation, ensembling, evaluation and plotting."
repos = [
  "hubverse", "hubUtils", "hubAdmin", "hubData", "hubValidations",
  "hubEnsembles", "hubEvals", "hubVis", "hubExamples",
]

[[category]]
key = "python"
title = "Python tools"
summary = "Python access to hub data and the transform used when model output is mirrored to the cloud."
repos = ["hub-data", "hubverse-transform", "hubDataPy"]

[[category]]
key = "schemas"
title = "Schemas"
summary = "JSON schemas that define valid hub configuration files. Versioned; docs.hubverse.io tracks one schema release."
repos = ["schemas"]

[[category]]
key = "docs"
title = "Documentation and websites"
summary = "User and developer documentation, the public landing page, the org profile, and the record of design decisions and project posters."
repos = ["hubDocs", "hubverse-site", ".github", "decisions"]

[[category]]
key = "dashboards"
title = "Dashboards"
summary = "Template, builders and operational workflows for hub dashboards (forecast visualisation and evaluation)."
repos = [
  "hub-dashboard-template", "hub-dashboard-predtimechart",
  "hub-dash-site-builder", "hubPredEvalsData", "hubPredEvalsData-docker",
  "predevals", "hub-dashboard-control-room",
  "dashboard-test-hub", "dashboard-test-hub-dashboard",
]

[[category]]
key = "cloud"
title = "Cloud infrastructure"
summary = "AWS resources and test hubs for mirroring hub data to S3."
repos = ["hubverse-infrastructure", "hubverse-cloud"]

[[category]]
key = "ci"
title = "CI, actions and developer tooling"
summary = "GitHub Actions for hubs and packages, package scaffolding, pkgdown styling, health checks and R-universe."
repos = [
  "hubverse-actions", "hubverse-developer-actions", "hubCI", "hubDevs",
  "hubStyle", "pkg-health-check", "hubverse-org.r-universe.dev",
  "test-docker-hubUtils-dev", "test-docker-hubValidations",
]

[[category]]
key = "llm-harness"
title = "LLM harness"
summary = "Context and skills that let LLM-based tools work with the hubverse."
repos = ["hubverse-llm-index", "hubverse-claude-skills"]

[[category]]
key = "example-hubs"
title = "Example, template and test hubs"
summary = "Hubs used as templates, examples in documentation and fixtures in CI."
repos = [
  "hubTemplate", "example-simple-forecast-hub",
  "example-complex-forecast-hub", "example-complex-scenario-hub",
  "ci-testhub-simple", "ci-testhub-simple-old-orgname", "ci-testhub-target",
]

[[category]]
key = "archives"
title = "Data archives"
summary = "Historical hubs converted to the hubverse format."
repos = ["covid19-forecast-hub-archive", "flusight_hub_archive"]
optional = true

[[category]]
key = "outreach"
title = "Publications and talks"
summary = "Manuscripts and conference talk materials."
repos = [
  "hubEnsemblesManuscript", "hubverse-talk-RSECon26",
  "hubverse-talk-usrse25",
]
optional = true

# Repositories whose Markdown files are listed one by one in llms.txt, in
# this order. `include` limits them to paths with these prefixes.
[[markdown]]
repo = "decisions"
site = "decisions"
title = "Decisions and project posters"
summary = "Project posters scope a piece of work. Requests for comments (RFC) and lightweight decision records (LDR) record design decisions and the reasons for them."
include = ["decisions/", "project-posters/"]

# Software outside hubverse-org that hubverse tools build on. Listed in
# llms.txt in this order. `docs` is needed only when the repository's
# homepage is not the documentation of this package, as for the arrow
# monorepo. Packages that depend on the hubverse are found by
# scripts/build.py and are not listed here.
[[external]]
name = "scoringutils"
repo = "epiforecasts/scoringutils"
summary = "Scores forecasts. hubEvals and hubPredEvalsData score predictions with it."

[[external]]
name = "arrow (R)"
repo = "apache/arrow"
docs = "https://arrow.apache.org/docs/r/"
summary = "Reads and queries Parquet and CSV datasets. hubData and hubValidations read model output and target data with it."

[[external]]
name = "pyarrow"
repo = "apache/arrow"
docs = "https://arrow.apache.org/docs/python/"
summary = "Python library for Arrow and Parquet. hub-data and hubverse-transform read and write hub data with it."

[[external]]
name = "jsonvalidate"
repo = "ropensci/jsonvalidate"
summary = "Validates JSON against a JSON schema. hubAdmin, hubValidations and hubPredEvalsData validate configuration files with it."

[[external]]
name = "distfromq"
repo = "reichlab/distfromq"
summary = "Reconstructs a distribution from a set of quantiles. hubEnsembles uses it for linear pool ensembles of quantile forecasts."

[[external]]
name = "zoltr"
repo = "reichlab/zoltr"
summary = "R client for the Zoltar forecast repository. hubData uses it to collect forecasts from Zoltar."

[[external]]
name = "predtimechart"
repo = "reichlab/predtimechart"
summary = "JavaScript forecast visualisation component. hub-dashboard-predtimechart builds the dashboard forecast view on it."
