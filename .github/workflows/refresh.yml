name: Refresh index

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index
        run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          branch: refresh-index
          title: Refresh knowledge base index
          commit-message: Refresh knowledge base index
          body: Weekly rebuild of `llms.txt` and `catalog/` from the current state of the org and its documentation sites.
          delete-branch: true
